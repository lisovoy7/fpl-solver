# ============================================================================
# fpl-solver configuration
# ============================================================================
# Default settings for the solver. To override any value without editing this
# file, create a config.local.yaml in the same directory with just the keys
# you want to change. Local overrides are deep-merged on top of these defaults.
#
# Example config.local.yaml:
#   team_id: 1234567
#   free_transfers: 2
#   solver:
#     max_scenarios: 50
#
# See README.md for full documentation of every parameter.

# ---------- Required ----------

# Your FPL team ID (from your team URL: fantasy.premierleague.com/entry/YOUR_ID/)
team_id: 4514531

# Free transfers available right now. Must be set manually because the FPL API
# does not reliably expose pending free transfers.
free_transfers: 1

# ---------- Auto-detected (override only if needed) ----------

# Current gameweek is auto-detected from the FPL API.
# Uncomment to override:
# current_gw: 27

# ---------- Solver parameters ----------

solver:
  # "rest_of_season" or an integer (e.g. 5 for 5-GW horizon)
  planning_horizon: rest_of_season

  # Early-season fallback. While this gameweek's deadline has NOT passed, use the
  # pre-computed proxy predictions in data/proxy_predictions.csv instead of
  # generating predictions from this season's history — which doesn't exist yet
  # (generate_predictions needs 60+ minute appearances, so it yields nothing in
  # GW1). Once the deadline passes, predictions are generated normally.
  # Set to null/0 to always use the normal pipeline.
  # NOTE: while active, the min_hist_pct filter is disabled (nobody has played
  # yet) and the proxy model assumes every player starts — check the squad it picks.
  points_pred_gw_threshold: 4

  # Fraction of the recent window a player must have started (60+ min) to enter
  # the candidate pool. Lower = more players (less reliable). Higher = fewer
  # players (more reliable). E.g. 0.6 = played 60+ min in >=60% of the window.
  min_hist_pct: 0.6

  # Upper bound on how many recent gameweeks are considered when checking
  # min_hist_pct. Early in the season, before this many GWs exist, the window
  # shrinks to however many GWs have actually been played — there is no lower
  # bound, so e.g. after GW1 a player who played is already in the watchlist.
  max_hist_window: 6

  # Probability that each starting-XI player won't play (rotation/injury).
  # 0.10 means ~1.1 expected subs per GW. Set to 0.0 to ignore bench value.
  sub_probability: 0.10

  # Artificial penalty per transfer in GW1 of the planning horizon.
  # Discourages the solver from front-loading transfers.  -1 = mild penalty.
  first_gw_transfer_penalty: -1

  # Solver time limit in seconds per chip scenario.
  #
  # This is a *quality* knob, not just a speed one: CBC almost never proves
  # optimality within it, so it caps how good each scenario's plan gets before
  # the search is cut off. Scenarios now solve in parallel worker processes
  # (see fpl/scenario_runner.py), so a larger value here is much cheaper than
  # it used to be — 60 on an 8-worker machine still beats the old sequential
  # run at 15 on wall clock.
  time_limit_per_scenario: 15

  # Stop a scenario early once CBC is within this relative gap of the best
  # possible objective (0.005 = 0.5%). null solves until time_limit_per_scenario.
  # Useful when many scenarios are easy and you would rather spend the wall
  # clock on the hard ones.
  mip_gap: null

  # Maximum chip scenarios to test (caps combinatorial explosion).
  max_scenarios: 1000

  # Triple Captain is scored post-hoc instead of multiplying into the FH x BB
  # scenario count (it only ever bonuses the plan's own best captain GW — see
  # find_best_triple_captain_gw in fpl/free_hit.py). This caps how many of the
  # top-scored (plan, TC GW) candidates get re-solved as full MILPs to confirm
  # the true objective. Higher = more thorough, slower. Ignored when TC is
  # forced via force_triple_captain_gw, or already fully used.
  triple_captain_candidates: 5

# ---------- Chip usage state ----------
# Auto-detected from FPL API if omitted. Override here if detection is wrong.
# All four chip types follow the same rule: one per half-season (GW 1-19 and
# GW 20-38), so each can be 0, 1, or 2.  All unused chips are automatically
# enumerated by the solver — no enable/disable toggles needed.

chips:
  # wildcards_used: 1        # 0, 1, or 2 (one per half-season) — auto-detected from API
  # free_hits_used: 1        # 0, 1, or 2 (one per half-season) — auto-detected from API
  # bench_boost_used: 1      # 0, 1, or 2 (one per half-season) — auto-detected from API
  # triple_captain_used: 1   # 0, 1, or 2 (one per half-season) — auto-detected from API

  # Force a chip on a specific GW. When set, the solver pins that chip to the
  # given GW and skips iterating over other options — much faster optimization.
  # Omit or set to null to let the solver decide the best GW for each chip.
  # force_free_hit_gw: 33
  # force_bench_boost_gw: 37
  # # force_triple_captain_gw: 34
  # force_wildcard_gw: 32

# ---------- AFCON Transfer top-up rule ----------
# After trigger_gw, the solver tops-up the transfer bank to transfer_count free transfers.

transfer_topup:
  enabled: false
  trigger_gw: 15
  transfer_count: 5

# ---------- Fixture overrides (DGW / BGW) ----------
# Override the gameweek assignment of specific fixtures.  Use this when the
# official schedule changes (postponements, double gameweeks, blank gameweeks)
# and the FPL API hasn't been updated yet.
# Each entry needs: home_team (team_id), away_team (team_id), gameweek (new GW).
# Find team IDs in data/team_tiers.csv.

fixture_overrides:
  # - home_team: 13      # Man City
  #   away_team: 8       # Crystal Palace
  #   gameweek: 36

# ---------- Player overrides ----------
# DISCLAIMER: The FPL API does NOT reflect transfers you've already made for the
# upcoming gameweek. If you've made transfers in the app, the solver won't see
# them. Run the solver BEFORE making transfers. Injuries, suspensions, and
# expected absences must also be entered manually below.

# Players who won't play in specific gameweeks (injury, suspension, rotation).
# Solver sets their expected points to 0 but may keep them in the squad.
non_playing: []
  # - player: 661     # Ekitike
  #   gameweeks: [21, 22]
  # - player: 441     # Dorgu
  #   gameweeks: [25, 26, 27, 28]

# Players forced into the starting lineup in specific gameweeks.
# Use when you have insider knowledge or want to lock in a differential.
forced_lineup: []
  # - player: 235     # Palmer
  #   gameweeks: [27]

# Adjust predicted points for specific players (across all gameweeks).
# multiplier > 1.0 = boost predictions, < 1.0 = reduce predictions.
# Useful when you believe the model under/over-estimates a player.
points_multiplier: []
  # - player: 235     # Palmer
  #   multiplier: 1.5

# Player IDs to always exclude from the candidate pool.
# Use for players you never want to own (non-differentials, personal preference).
excluded_players: []
  # - 5    # Gabriel

